<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="SS-31 (elamipretide): a designed tetrapeptide. D-Arg-Dmt-Lys-Phe-NH2; about 640 Da" font-family="Inter,Arial,sans-serif">
<rect width="900" height="270" rx="14" fill="#f7fafc" stroke="#d5dee8"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#0f2742">SS-31 (elamipretide): a designed tetrapeptide</text>
<text x="30" y="62" font-size="13" fill="#51606f">D-Arg-Dmt-Lys-Phe-NH2; about 640 Da</text>
<circle cx="152.5" cy="120" r="38" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="152.5" y="125" text-anchor="middle" font-size="9" font-weight="600" fill="#0f2742">D-Arg</text><text x="152.5" y="172" text-anchor="middle" font-size="10" fill="#7a8794">1</text><line x1="190.5" y1="120" x2="299.5" y2="120" stroke="#8a9bb0" stroke-width="2"/><circle cx="337.5" cy="120" r="38" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="337.5" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#0f2742">Dmt</text><text x="337.5" y="172" text-anchor="middle" font-size="10" fill="#7a8794">2</text><line x1="375.5" y1="120" x2="484.5" y2="120" stroke="#8a9bb0" stroke-width="2"/><circle cx="522.5" cy="120" r="38" fill="#cde0f7" stroke="#7d93ab" stroke-width="1.5"/><text x="522.5" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#0f2742">Lys</text><text x="522.5" y="172" text-anchor="middle" font-size="10" fill="#7a8794">3</text><line x1="560.5" y1="120" x2="669.5" y2="120" stroke="#8a9bb0" stroke-width="2"/><circle cx="707.5" cy="120" r="38" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="707.5" y="125" text-anchor="middle" font-size="9" font-weight="600" fill="#0f2742">Phe-NH2</text><text x="707.5" y="172" text-anchor="middle" font-size="10" fill="#7a8794">4</text><text x="30" y="125" font-size="11" fill="#0f766e" font-weight="700">N</text><text x="30" y="220" font-size="12" fill="#51606f">D-Arg and Dmt (2',6'-dimethyltyrosine) are non-natural; swapping Dmt for tyrosine would shift the mass by about 28 Da.</text><rect x="30" y="236" width="14" height="14" rx="3" fill="#cfe8e4" stroke="#9fb0c3"/><text x="50" y="247" font-size="12" fill="#445">Hydrophobic</text><rect x="137" y="236" width="14" height="14" rx="3" fill="#e6edf5" stroke="#9fb0c3"/><text x="157" y="247" font-size="12" fill="#445">Polar</text><rect x="202" y="236" width="14" height="14" rx="3" fill="#cde0f7" stroke="#9fb0c3"/><text x="222" y="247" font-size="12" fill="#445">Positive</text><rect x="288" y="236" width="14" height="14" rx="3" fill="#f9d9d4" stroke="#9fb0c3"/><text x="308" y="247" font-size="12" fill="#445">Negative</text><rect x="374" y="236" width="14" height="14" rx="3" fill="#eef0f2" stroke="#9fb0c3"/><text x="394" y="247" font-size="12" fill="#445">Glycine</text><rect x="453" y="236" width="14" height="14" rx="3" fill="#fdebb8" stroke="#9fb0c3"/><text x="473" y="247" font-size="12" fill="#445">Modified / non-natural</text></svg>