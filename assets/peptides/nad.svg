<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="NAD+ at a glance. A dinucleotide coenzyme: two nucleotide halves joined by a pyrophosphate bridge" font-family="Inter,Arial,sans-serif">
<rect width="900" height="280" rx="14" fill="#f7fafc" stroke="#d5dee8"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#0f2742">NAD+ at a glance</text>
<text x="30" y="62" font-size="13" fill="#51606f">A dinucleotide coenzyme: two nucleotide halves joined by a pyrophosphate bridge</text>
<rect x="40" y="110" width="150" height="70" rx="12" fill="#cde0f7" stroke="#7d93ab" stroke-width="1.5"/><text x="115.0" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#0f2742">Nicotinamide</text><line x1="190" y1="145" x2="215" y2="145" stroke="#8a9bb0" stroke-width="3"/><rect x="215" y="110" width="150" height="70" rx="12" fill="#e6edf5" stroke="#7d93ab" stroke-width="1.5"/><text x="290.0" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#0f2742">Ribose</text><line x1="365" y1="145" x2="390" y2="145" stroke="#8a9bb0" stroke-width="3"/><rect x="390" y="110" width="150" height="70" rx="12" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="465.0" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#0f2742">Pyrophosphate</text><line x1="540" y1="145" x2="565" y2="145" stroke="#8a9bb0" stroke-width="3"/><rect x="565" y="110" width="150" height="70" rx="12" fill="#e6edf5" stroke="#7d93ab" stroke-width="1.5"/><text x="640.0" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#0f2742">Ribose</text><line x1="715" y1="145" x2="740" y2="145" stroke="#8a9bb0" stroke-width="3"/><rect x="740" y="110" width="150" height="70" rx="12" fill="#cfe8e4" stroke="#7d93ab" stroke-width="1.5"/><text x="815.0" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#0f2742">Adenine</text><text x="40" y="215" font-size="12" fill="#51606f">C21H27N7O14P2, about 663 Da. Not a peptide: it has no amino acids or sequence.</text><text x="40" y="236" font-size="12" fill="#51606f">The nicotinamide-ribose bond is the weak point: heat and moisture break it down to nicotinamide and ADP-ribose.</text></svg>