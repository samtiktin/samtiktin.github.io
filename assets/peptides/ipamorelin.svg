<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Ipamorelin: a pentapeptide with non-natural residues. Aib-His-D-2Nal-D-Phe-Lys-NH2; about 712 Da" font-family="Inter,Arial,sans-serif">
<rect width="900" height="270" rx="14" fill="#f7fafc" stroke="#d5dee8"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#0f2742">Ipamorelin: a pentapeptide with non-natural residues</text>
<text x="30" y="62" font-size="13" fill="#51606f">Aib-His-D-2Nal-D-Phe-Lys-NH2; about 712 Da</text>
<circle cx="134.0" cy="120" r="36" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="134.0" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#0f2742">Aib</text><text x="134.0" y="170" text-anchor="middle" font-size="10" fill="#7a8794">1</text><line x1="170.0" y1="120" x2="246.0" y2="120" stroke="#8a9bb0" stroke-width="2"/><circle cx="282.0" cy="120" r="36" fill="#cde0f7" stroke="#7d93ab" stroke-width="1.5"/><text x="282.0" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#0f2742">His</text><text x="282.0" y="170" text-anchor="middle" font-size="10" fill="#7a8794">2</text><line x1="318.0" y1="120" x2="394.0" y2="120" stroke="#8a9bb0" stroke-width="2"/><circle cx="430.0" cy="120" r="36" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="430.0" y="125" text-anchor="middle" font-size="9" font-weight="600" fill="#0f2742">D-2Nal</text><text x="430.0" y="170" text-anchor="middle" font-size="10" fill="#7a8794">3</text><line x1="466.0" y1="120" x2="542.0" y2="120" stroke="#8a9bb0" stroke-width="2"/><circle cx="578.0" cy="120" r="36" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="578.0" y="125" text-anchor="middle" font-size="9" font-weight="600" fill="#0f2742">D-Phe</text><text x="578.0" y="170" text-anchor="middle" font-size="10" fill="#7a8794">4</text><line x1="614.0" y1="120" x2="690.0" y2="120" stroke="#8a9bb0" stroke-width="2"/><circle cx="726.0" cy="120" r="36" fill="#fdebb8" stroke="#7d93ab" stroke-width="1.5"/><text x="726.0" y="125" text-anchor="middle" font-size="9" font-weight="600" fill="#0f2742">Lys-NH2</text><text x="726.0" y="170" text-anchor="middle" font-size="10" fill="#7a8794">5</text><text x="30" y="125" font-size="11" fill="#0f766e" font-weight="700">N</text><text x="30" y="220" font-size="12" fill="#51606f">Mirror-image (D) residues have the same mass as natural ones, so chirality errors show up only on chromatography.</text><rect x="30" y="236" width="14" height="14" rx="3" fill="