<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="TB-500 versus thymosin beta-4. The name is used for different molecules by different sellers" font-family="Inter,Arial,sans-serif">
<rect width="900" height="300" rx="14" fill="#f7fafc" stroke="#d5dee8"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#0f2742">TB-500 versus thymosin beta-4</text>
<text x="30" y="62" font-size="13" fill="#51606f">The name is used for different molecules by different sellers</text>
<text x="30" y="100" font-size="13" font-weight="600" fill="#0f2742">Thymosin beta-4, full protein (43 amino acids, about 4,963 Da)</text><rect x="30" y="110" width="800" height="26" rx="6" fill="#e6edf5" stroke="#9fb0c3"/><rect x="30" y="110" width="800" height="26" rx="6" fill="#9fb8d4"/><text x="30" y="154" font-size="12" fill="#51606f">Full-length natural protein; hard to synthesize cleanly</text><text x="30" y="180" font-size="13" font-weight="600" fill="#0f2742">Short fragment, residues 17-23: Ac-LKKTETQ (about 889 Da)</text><rect x="30" y="190" width="800" height="26" rx="6" fill="#e6edf5" stroke="#9fb0c3"/><rect x="328" y="190" width="130" height="26" rx="6" fill="#0f766e"/><text x="30" y="234" font-size="12" fill="#51606f">Actin-binding region; the form described in anti-doping literature</text><text x="30" y="280" font-size="12" fill="#51606f">Always check the certificate of analysis mass to see which one a listing is.</text></svg>